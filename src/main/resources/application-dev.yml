# Local development: defaults match docker-compose.yml, any value can be overridden with environment variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:spending_limits}}
    username: ${DB_USERNAME:spending_limits}
    password: ${DB_PASSWORD:spending_limits}

app:
  rates:
    # Every Twelve Data request costs credits: locally fixed rates are used unless RATES_PROVIDER=twelvedata
    provider: ${RATES_PROVIDER:fixed}
