# Settings shared by all profiles. Connection settings live in profile files:
# dev has local defaults, prod requires environment variables and fails fast without them.
spring:
  application:
    name: spending-limit-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true

  datasource:
    hikari:
      # A transaction waiting for a locked row gives up after this time instead of hanging; the work is retried later
      connection-init-sql: SET lock_timeout TO '${DB_LOCK_TIMEOUT:5s}'

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      fail-on-trailing-tokens: true
      use-big-decimal-for-floats: true
    mapper:
      # "sum": "10.00" is rejected instead of silently converted; number-to-string is blocked by StrictStringModule
      allow-coercion-of-scalars: false
    datatype:
      datetime:
        # Keep the offset the client sent (+06:00) instead of converting to UTC
        adjust-dates-to-context-time-zone: false
        write-dates-with-context-time-zone: false
        write-dates-as-timestamps: false
    write:
      write-bigdecimal-as-plain: true

  web:
    # Validation messages are the same on every machine regardless of OS locale or Accept-Language
    locale: en
    locale-resolver: fixed

  http:
    serviceclient:
      twelvedata:
        base-url: ${TWELVEDATA_BASE_URL:https://api.twelvedata.com}
        connect-timeout: 2s
        read-timeout: 3s
        # Key in a header, not in the URL: URLs end up in access logs, proxies and error messages
        default-header:
          Authorization: apikey ${app.rates.twelve-data.api-key}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logbook:
  predicate:
    exclude:
      - path: /actuator/**
      - path: /v3/api-docs/**
      - path: /swagger-ui/**
  obfuscate:
    headers:
      - Authorization
      - Cookie
      - Set-Cookie
    parameters:
      - apikey
      - account
    json-body-fields:
      - account
      - account_from
      - account_to
  format:
    style: http

app:
  # Calendar days and months (limit periods, the day of a rate) are counted in this zone
  business-zone: ${BUSINESS_ZONE:UTC}
  scheduling:
    enabled: true
  rates:
    provider: ${RATES_PROVIDER:twelvedata}
    lookback-days: 10
    supported-currencies: KZT, RUB
    prefetch-cron: "0 5 0 * * *"
    twelve-data:
      api-key: ${TWELVEDATA_API_KEY:}
      # Immediate retries of transient failures: 200 ms, then 400 ms
      max-retries: 2
      retry-delay: 200ms
    fixed:
      units-per-usd:
        KZT: 450.00
        RUB: 75.00
  limits:
    default-amount: 1000.00
  transactions:
    allowed-clock-skew: 5m
    retry:
      poll-interval: 30s
      first-delay: 30s
      max-delay: 1h
      lease: 2m
      batch-size: 50
      parallelism: 8
