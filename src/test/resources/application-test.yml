spring:
  datasource:
    hikari:
      # Lock-timeout tests should not wait the production 5 seconds
      connection-init-sql: SET lock_timeout TO '1s'
  jpa:
    properties:
      hibernate:
        # Needed by QueryCounter to assert the number of SQL statements
        generate_statistics: true
  http:
    serviceclient:
      twelvedata:
        # base-url points to WireMock, see TwelveDataMockConfiguration
        read-timeout: 2s

app:
  # Jobs are triggered explicitly by the tests that need them
  scheduling:
    enabled: false
  rates:
    provider: twelvedata
    twelve-data:
      api-key: test-api-key
      retry-delay: 10ms
  transactions:
    retry:
      first-delay: 0s

logging:
  level:
    # Statistics are collected for assertions, not printed after every session
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
